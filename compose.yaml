

services:
  postgres:
    image: postgres:17-alpine
    container_name: peakcloud-postgres
    environment:
      POSTGRES_USER: peakcloud
      POSTGRES_PASSWORD: peakcloud
      POSTGRES_DB: peakcloud
    ports:
      - "5433:5432"
    volumes:
      - peakcloud-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peakcloud -d peakcloud"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: peakcloud-redis
    ports:
      - "6380:6379"
    volumes:
      - peakcloud-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: peakcloud-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: peakcloud
      MINIO_ROOT_PASSWORD: peakcloud-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - peakcloud-minio-data:/data

volumes:
  peakcloud-postgres-data:
  peakcloud-redis-data:
  peakcloud-minio-data:
